<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172b28">
<meta name="description" content="Read and search Holy Thursday Letters and Pastores Dabo Vobis by Saint John Paul II.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css">
<title>SACERDOS</title>
<script type="module" src="./app.js"></script>
</head>
<body>
<header><div class="frame masthead"><a class="brand" href="#"><img src="./icon-192.png" width="38" height="38" alt="">SACERDOS</a><button id="install" hidden>Install app</button><span id="offline" hidden>Offline</span></div></header>
<main class="frame">
<section id="landing" aria-labelledby="landing-title">
  <img class="landing-mark" src="./icon-192.png" alt="" width="72" height="72">
  <h1 id="landing-title">SACERDOS</h1>
  <p>Holy Thursday Letters and <em>Pastores Dabo Vobis</em> by Saint John Paul II.</p>
  <a class="landing-action" href="#library">Open library</a>
</section>
<section id="library" hidden>
  <div class="hero">
    <p class="eyebrow">Saint John Paul II</p>
    <h1 id="library-title" tabindex="-1">Holy Thursday Letters</h1>
    <p>Includes <em>Pastores Dabo Vobis</em>.</p>
  </div>
  <div class="controls">
    <label>Search the collection<input id="query" type="search" placeholder="Search for a word or phrase" autocomplete="off" dir="auto"></label>
    <label>Reading language<select id="locale"></select></label>
  </div>
  <div class="section-head"><h2 id="view-title">Collection</h2><p id="status" role="status">Loading collection…</p></div>
  <div id="results"></div>
</section>
<section id="reader" hidden></section>
</main>
<footer class="frame">SACERDOS <span>Saint John Paul II</span></footer>
</body>
</html>
